name: Proxy Connectivity Test (temp)

on:
  push:
    branches: [the-ultra-nexus/fix-proxy]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Test https proxy list
        run: ./scripts/test_proxy_connectivity.sh 'https://cdn.jsdelivr.net/gh/proxyscrape/free-proxy-list@main/proxies/protocols/https/data.txt'
