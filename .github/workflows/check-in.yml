name: Daily Check In

on:
  schedule:
    # 08:00 Asia/Shanghai (UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "要运行的站点（逗号分隔，留空用仓库变量/全部）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 多站点通用配置：SITE_CONFIGS 为 JSON Secret，包含全部站点；
      # CHECK_IN_SITES 优先取手动输入，其次仓库变量（留空则运行 SITE_CONFIGS 全部站点）
      CHECK_IN_SITES: ${{ inputs.sites || vars.CHECK_IN_SITES }}
      SITE_CONFIGS: ${{ secrets.SITE_CONFIGS }}
      # 代理（IP 池，逗号分隔多个池 URL；按需分批补给，按需配置对应 Secret）
      CHECK_IN_PROXY_POOL_URLS: ${{ secrets.CHECK_IN_PROXY_POOL_URLS }}
      # 通知渠道（按需配置对应 Secrets）
      BARK_PUSH: ${{ secrets.BARK_PUSH }}
      PUSH_KEY: ${{ secrets.PUSH_KEY }}
      FSKEY: ${{ secrets.FSKEY }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_USER_ID: ${{ secrets.TG_USER_ID }}
      DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}
      DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
      QYWX_KEY: ${{ secrets.QYWX_KEY }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_SSL: ${{ secrets.SMTP_SSL }}
      SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_NAME: ${{ secrets.SMTP_NAME }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify env coverage
        run: uv run python -m unittest tests.test_github_workflow -v

      - name: Restore session cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .runtime/sessions
          key: sessions-${{ runner.os }}-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            sessions-${{ runner.os }}-${{ github.ref }}-

      - name: Inspect session cache
        run: |
          if [ -d .runtime/sessions ] && [ "$(find .runtime/sessions -type f | wc -l | tr -d ' ')" -gt 0 ]; then
            echo "session_files=$(find .runtime/sessions -type f | wc -l | tr -d ' ')"
            echo "session_size=$(du -sh .runtime/sessions | cut -f1)"
            find .runtime/sessions -type f -printf '%f %s bytes\n'
          else
            echo "session_files=0"
            echo "session_size=0B"
          fi

      - name: Run check-in
        run: |
          set -o pipefail
          mkdir -p .runtime
          uv run auto-check-in --config config/check-in.toml | tee .runtime/check-in-output.txt

      - name: Verify cache reuse
        if: steps.restore.outputs.cache-hit == 'true'
        run: |
          counters=$(sed -n 's/.*会话缓存: 恢复 \([0-9][0-9]*\) \/ 被拒重登 \([0-9][0-9]*\) \/ 新保存 \([0-9][0-9]*\).*/\1 \2 \3/p' .runtime/check-in-output.txt | tail -n1)
          if [ -z "$counters" ]; then
            echo "::warning title=Unused session cache::cache-hit=true but no session-cache counters in output (key: ${{ steps.restore.outputs.cache-matched-key }})"
          else
            restored=$(printf '%s\n' "$counters" | awk '{print $1}')
            rejected=$(printf '%s\n' "$counters" | awk '{print $2}')
            saved=$(printf '%s\n' "$counters" | awk '{print $3}')
            if [ "$restored" = "0" ] || [ "$saved" = "0" ]; then
              echo "::warning title=Unused session cache::cache-hit=true restored=$restored rejected=$rejected saved=$saved (key: ${{ steps.restore.outputs.cache-matched-key }})"
            fi
          fi

      - name: Prepare cache save
        id: prepare
        run: |
          if [ -d .runtime/sessions ] && [ "$(find .runtime/sessions -type f | wc -l | tr -d ' ')" -gt 0 ]; then
            echo "skip=false"
          else
            echo "skip=true"
          fi

      - name: Save session cache
        if: always() && steps.prepare.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: .runtime/sessions
          key: sessions-${{ runner.os }}-${{ github.ref }}-${{ github.run_id }}
